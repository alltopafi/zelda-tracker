apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zelda-tracker

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml

# config.toml becomes a ConfigMap with a content hash in its name, so editing
# the file and re-applying rolls the pod automatically.
configMapGenerator:
  - name: zelda-tracker-config
    files:
      - config.toml

# Built and pushed by .github/workflows/docker-publish.yml on every push to main.
# To pin a build, replace "latest" with a commit tag such as "sha-c744162".
images:
  - name: zelda-tracker
    newName: ghcr.io/alltopafi/zelda-tracker
    newTag: latest
